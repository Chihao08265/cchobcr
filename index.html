<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baccarat AI Predictor Pro</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin: 0 0 20px 0;
            font-size: 1.3rem;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-align: center;
        }
        input {
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 1.4rem;
            text-align: center;
            width: 100%;
        }
        input:focus {
            border-color: #00d2ff;
            outline: none;
        }
        .btn-predict {
            width: 100%;
            padding: 14px;
            background: #007acc;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .btn-predict:disabled {
            background: #555555;
            cursor: not-allowed;
        }
        .result-box {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .loading-text {
            text-align: center;
            font-size: 1.1rem;
            color: #ffca28;
            font-weight: bold;
            padding: 15px 0;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 0.95rem;
            text-align: center;
        }
        .prob-container {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            gap: 6px;
        }
        .prob-card {
            flex: 1;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            color: #fff;
            font-weight: bold;
        }
        .prob-p { background-color: #007bff; } /* Xanh dương */
        .prob-b { background-color: #dc3545; } /* Đỏ */
        .prob-t { background-color: #28a745; } /* Xanh lá */

        .trend-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .trend-card {
            flex: 1;
            background: #2f2f2f;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #444;
        }
        .trend-title {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .trend-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .prob-title {
            font-size: 0.7rem;
            opacity: 0.9;
            margin-bottom: 2px;
        }
        .prob-value {
            font-size: 1rem;
        }

        .prediction-highlight {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
            text-align: center;
        }

        .text-p { color: #007bff; }
        .text-b { color: #dc3545; }
        .text-t { color: #28a745; }
        .text-streak { color: #ffca28; }
        .text-cut { color: #00ffcc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Baccarat AI Predictor Pro</h2>
    
    <div class="input-group">
        <div class="input-field">
            <label style="color: #007bff; font-weight: bold;">Điểm Player</label>
            <input type="number" id="pScore" pattern="[0-9]*" inputmode="numeric" placeholder="0-9">
        </div>
        <div class="input-field">
            <label style="color: #dc3545; font-weight: bold;">Điểm Banker</label>
            <input type="number" id="bScore" pattern="[0-9]*" inputmode="numeric" placeholder="0-9">
        </div>
    </div>

    <button type="button" class="btn-predict" id="predictBtn">Dự Đoán Ván Tiếp Theo</button>

    <div class="result-box" id="resultBox">
        <div id="loadingView" class="loading-text" style="display: none;">
            ⚡ Đang phân tích xác suất... <span id="countdown">3</span>s
        </div>

        <div id="contentView" style="display: none;">
            <div class="result-item" id="roundResult">Kết quả ván này: -</div>
            
            <!-- Tỷ lệ Player / Banker / Tie -->
            <div class="prob-container">
                <div class="prob-card prob-p">
                    <div class="prob-title">PLAYER</div>
                    <div class="prob-value" id="rateP">0%</div>
                </div>
                <div class="prob-card prob-b">
                    <div class="prob-title">BANKER</div>
                    <div class="prob-value" id="rateB">0%</div>
                </div>
                <div class="prob-card prob-t">
                    <div class="prob-title">TIE</div>
                    <div class="prob-value" id="rateT">0%</div>
                </div>
            </div>

            <!-- Tỷ lệ Cầu Bệt và Bẻ Cầu -->
            <div class="trend-container">
                <div class="trend-card">
                    <div class="trend-title">⚡ TỶ LỆ CẦU BỆT</div>
                    <div class="trend-value text-streak" id="streakRate">0%</div>
                </div>
                <div class="trend-card">
                    <div class="trend-title">🔄 TỶ LỆ BẺ CẦU</div>
                    <div class="trend-value text-cut" id="cutRate">0%</div>
                </div>
            </div>

            <div class="prediction-highlight" id="predictionText">Đang chờ tính toán...</div>
        </div>
    </div>
</div>

<script>
    const pInput = document.getElementById('pScore');
    const bInput = document.getElementById('bScore');
    const predictBtn = document.getElementById('predictBtn');
    const resultBox = document.getElementById('resultBox');
    const loadingView = document.getElementById('loadingView');
    const contentView = document.getElementById('contentView');
    const countdownEl = document.getElementById('countdown');

    const roundResult = document.getElementById('roundResult');
    const rateP = document.getElementById('rateP');
    const rateB = document.getElementById('rateB');
    const rateT = document.getElementById('rateT');
    const streakRate = document.getElementById('streakRate');
    const cutRate = document.getElementById('cutRate');
    const predictionText = document.getElementById('predictionText');

    function startPrediction() {
        const pVal = pInput.value.trim();
        const bVal = bInput.value.trim();

        if (pVal === "" || bVal === "") {
            alert("Vui lòng nhập đủ điểm cho cả 2 bên!");
            return;
        }

        const p = parseInt(pVal, 10);
        const b = parseInt(bVal, 10);

        if (isNaN(p) || isNaN(b) || p < 0 || p > 9 || b < 0 || b > 9) {
            alert("Điểm số phải nằm trong khoảng từ 0 đến 9!");
            return;
        }

        predictBtn.disabled = true;
        resultBox.style.display = 'block';
        loadingView.style.display = 'block';
        contentView.style.display = 'none';

        let timeLeft = 3;
        countdownEl.textContent = timeLeft;

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                renderResult(p, b);
            }
        }, 1000);
    }

    function renderResult(p, b) {
        let winnerText = "";
        let winnerClass = "";
        let code = 'T';

        if (p > b) {
            winnerText = "Player (P)";
            winnerClass = "text-p";
            code = 'P';
        } else if (b > p) {
            winnerText = "Banker (B)";
            winnerClass = "text-b";
            code = 'B';
        } else {
            winnerText = "Hòa (Tie)";
            winnerClass = "text-t";
            code = 'T';
        }

        let margin = Math.abs(p - b);
        roundResult.innerHTML = `Vừa ra: <strong class="${winnerClass}">${winnerText}</strong> (Cách biệt: ${margin}đ)`;

        // Tính toán tỷ lệ phần trăm xác suất chính xác
        let probP = 45, probB = 46, probT = 9;
        let sRate = 50, cRate = 50; // Cầu bệt và Bẻ cầu

        if (code === 'P') {
            if (margin >= 4) {
                // Cách biệt lớn -> Xu hướng bẻ cầu (đảo chiều) cao hơn
                probB = 64; probP = 27; probT = 9;
                cRate = 64; sRate = 36;
            } else if (margin <= 2) {
                // Cách biệt sát nút -> Xu hướng bệt cao hơn
                probP = 62; probB = 29; probT = 9;
                sRate = 62; cRate = 38;
            } else {
                probP = 52; probB = 39; probT = 9;
                sRate = 53; cRate = 47;
            }
        } else if (code === 'B') {
            if (margin >= 4) {
                probP = 65; probB = 26; probT = 9;
                cRate = 65; sRate = 35;
            } else if (margin <= 2) {
                probB = 63; probP = 28; probT = 9;
                sRate = 63; cRate = 37;
            } else {
                probB = 53; probP = 38; probT = 9;
                sRate = 54; cRate = 46;
            }
        } else {
            probP = 46; probB = 45; probT = 9;
            sRate = 50; cRate = 50;
        }

        // Cập nhật giao diện %
        rateP.textContent = probP + "%";
        rateB.textContent = probB + "%";
        rateT.textContent = probT + "%";
        
        streakRate.textContent = sRate + "%";
        cutRate.textContent = cRate + "%";

        // Đưa ra đáp án cuối cùng
        let mainPrediction = "";
        if (probP > probB) {
            mainPrediction = `👉 ĐÁP ÁN: <span class="text-p">PLAYER (P)</span><br><span style="font-size:0.85rem; color:#aaa;">(Ưu tiên: ${sRate >= cRate ? 'Theo cầu bệt' : 'Bẻ cầu đổi chiều'})</span>`;
        } else {
            mainPrediction = `👉 ĐÁP ÁN: <span class="text-b">BANKER (B)</span><br><span style="font-size:0.85rem; color:#aaa;">(Ưu tiên: ${sRate >= cRate ? 'Theo cầu bệt' : 'Bẻ cầu đổi chiều'})</span>`;
        }

        predictionText.innerHTML = mainPrediction;

        loadingView.style.display = 'none';
        contentView.style.display = 'block';
        predictBtn.disabled = false;
    }

    predictBtn.addEventListener('click', startPrediction);

    bInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startPrediction();
    });
    pInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') bInput.focus();
    });
</script>

</body>
</html>
